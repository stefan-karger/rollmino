<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Rollmino, a timed solo puzzle." />
    <title>Rollmino</title>
  </head>
  <body>
    <main>
      <h1>Rollmino</h1>
      <div class="run-header">
        <span class="level-picker"><label for="level">Level</label> <select id="level"></select></span>
        <span id="timer" role="timer" aria-label="Elapsed time" aria-live="off">00:00.00</span>
      </div>
      <p id="rule"></p><p id="mode"></p>
      <section id="game" aria-label="Puzzle controls">
        <div class="board-frame">
          <svg id="board-art" viewBox="-0.45 -0.45 6.5 6.5" aria-hidden="true"></svg>
          <div id="grid" role="grid" aria-label="Puzzle board"></div>
          <div id="ready"><p>Puzzle hidden until Start.</p><button id="start">Start</button></div>
        </div>
        <div class="tools">
          <button id="rotate">Rotate</button><button id="flip">Flip</button>
          <button id="remove">Remove</button><button id="undo">Undo</button>
        </div>
        <p id="preview">Select a piece, then a board cell.</p>
        <div id="tray" aria-label="Piece tray"></div>
      </section>
      <p id="status" role="status" aria-live="polite" aria-atomic="true">Press Start to reveal your puzzle.</p>
      <div class="run-actions"><button id="new-game">New game</button><button id="replay">Replay</button></div>
      <p class="help">Tap a piece, then a cell. Rotate clockwise or flip left/right. Keyboard: arrows, R, F, Delete and Escape.</p>
    </main>
    <dialog id="confirm-dialog" aria-labelledby="confirm-title">
      <h2 id="confirm-title">Abandon this run?</h2><p id="confirm-text"></p>
      <form method="dialog"><button value="cancel" autofocus>Cancel</button><button value="confirm">Confirm</button></form>
    </dialog>
    <script type="module" src="./src/app.ts"></script>
  </body>
</html>
