name: Check and deploy Rollmino

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# All publication runs share one group; PR checks use independent groups.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deployment' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Select verification scope
        id: scope
        env:
          ROLLMINO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ROLLMINO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/verification-scope.mjs "$GITHUB_EVENT_NAME"
      - name: Check documentation consistency
        run: pnpm run check:docs
      - name: Install dependencies
        if: steps.scope.outputs.pure == 'true' || steps.scope.outputs.build == 'true' || steps.scope.outputs.exhaustive == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers and system dependencies
        if: steps.scope.outputs.browser != 'none' || steps.scope.outputs.artifact == 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Test pure rules, transforms, sessions and records
        if: steps.scope.outputs.pure == 'true'
        run: pnpm test
      - name: Typecheck and build once
        if: steps.scope.outputs.build == 'true'
        run: pnpm run build
      - name: Test the development browser matrix
        if: steps.scope.outputs.browser == 'all'
        run: pnpm run test:e2e
      - name: Test affected UI and native input
        if: steps.scope.outputs.browser == 'ui'
        run: pnpm run test:e2e e2e/play.spec.ts e2e/input.spec.ts e2e/accessibility.spec.ts
      - name: Test affected records and gameplay
        if: steps.scope.outputs.browser == 'records'
        run: pnpm run test:e2e e2e/play.spec.ts e2e/records.spec.ts
      - name: Test the existing artifact at root and Pages subpath
        if: steps.scope.outputs.artifact == 'true'
        run: pnpm run test:e2e:prod
      - name: Independently verify every Wizard solution
        if: steps.scope.outputs.exhaustive == 'true'
        run: pnpm run verify:all
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload the tested artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy tested artifact
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
