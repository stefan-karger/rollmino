name: Check and deploy Rollmino

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# All publication runs share one group; PR checks use independent groups.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deployment' }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers and system dependencies
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Test pure rules, transforms, sessions and records
        run: pnpm test
      - name: Typecheck and build once
        run: pnpm run build
      - name: Test the development browser matrix
        run: pnpm run test:e2e
      - name: Test the existing artifact at root and Pages subpath
        run: pnpm run test:e2e:prod
      - name: Independently verify every Wizard solution
        run: pnpm run verify:all
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload the tested artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy tested artifact
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
